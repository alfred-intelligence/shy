name: CI

# mnab CI-gate-gradient proof (DECISIONS.md "CI-grind-konvention", 2026-07-09).
# Gate intensity is derived from branch -> channel and handed to the org's
# shared mnab-gate.yml, which composes go-bash-ci.yml for the gate bodies.
# The two repo-specific extras below (goreleaser-check, plugin-dispatch-perf)
# are NOT part of the shared gradient contract — they stay local, but are now
# gated to skip on the dark channel so `after` keeps the "near-zero gates"
# promise instead of quietly still paying the old full toll.

on:
  push:
    branches: [before, main, next, after]
  pull_request:

permissions:
  contents: read

jobs:
  # Maps the branch this run targets to its mnab release channel. Uses
  # head_ref for PRs (the branch being merged FROM) and ref_name for pushes.
  channel:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.map.outputs.channel }}
    steps:
      - id: map
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$REF_NAME" in
            before) echo "channel=patch" >> "$GITHUB_OUTPUT" ;;
            main)   echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            next)   echo "channel=light" >> "$GITHUB_OUTPUT" ;;
            after)  echo "channel=dark" >> "$GITHUB_OUTPUT" ;;
            *)      echo "channel=light" >> "$GITHUB_OUTPUT" ;;  # feature branches default to light's bar
          esac

  # Delegate the gate gradient to the org reusable workflow. Emitted contexts
  # vary by channel: dark -> "gate / conventional-commits" + "gate /
  # dark-build"; light -> "gate / conventional-commits" + "gate / light-gates
  # / go-test" + "... / go-lint"; stable+patch -> "gate / conventional-commits"
  # + "gate / full-gauntlet / go-test|go-lint|shell-lint". Branch protection
  # per channel must require the matching subset — see docs/ci.md in
  # .github-workflows for the full table.
  #
  # SHA pinned to alfred-intelligence/.github-workflows PR#5
  # (ci/mnab-gate-gradient, unmerged as of this PR). REPIN to the merge SHA
  # on main once that PR lands — this is a deliberate, flagged exception to
  # "pin to main" so the gradient can be proven end-to-end on shy first.
  gate:
    needs: channel
    uses: alfred-intelligence/.github-workflows/.github/workflows/mnab-gate.yml@e268c353956f159d413f79f16cf835622d0ffb70 # ci/mnab-gate-gradient PR#5, pending merge
    with:
      channel: ${{ needs.channel.outputs.channel }}
      go-version-file: go.mod
      # Widen shellcheck coverage beyond the former install.sh+init/init.bash
      # to include internal/cmd/init.bash and all scripts/ shell files.
      # examples/ deliberately excluded: user-authored content, not CI gates.
      shellcheck-paths: >-
        install.sh
        init/init.bash
        internal/cmd/init.bash
        scripts/acceptance-happy-path.sh
        scripts/acceptance-negative-path.sh
        scripts/bench-plugin-dispatch.sh
        scripts/setup-permissions.sh

  # Emitted context: "goreleaser-check". Repo-specific, stays local. Skipped
  # on dark: goreleaser-check is a release-shape check, not "does it build",
  # and dark's whole point is paying near-zero gate cost per push.
  goreleaser-check:
    needs: channel
    if: needs.channel.outputs.channel != 'dark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: check

  # Emitted context: "plugin-dispatch-perf". Repo-specific, stays local.
  # Skipped on dark for the same reason as goreleaser-check above.
  plugin-dispatch-perf:
    needs: channel
    if: needs.channel.outputs.channel != 'dark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build -o dist/shy ./cmd
      - env:
          SHY_BIN: ./dist/shy
          SHY_BENCH_N: "100"
          SHY_BENCH_MAX: "100"
        run: ./scripts/bench-plugin-dispatch.sh
