name: CI

on:
  push:
    branches: [main, next]
  pull_request:

permissions:
  contents: read

jobs:
  # Delegate go-test / go-lint / shell-lint to the org reusable workflow.
  # Emitted contexts: "ci / go-test", "ci / go-lint", "ci / shell-lint".
  # These are the names branch protection must require — not the bare job names.
  # Ref pinned to commit SHA so supply-chain drift is caught at review time.
  ci:
    uses: alfred-intelligence/.github-workflows/.github/workflows/go-bash-ci.yml@854faf25fdc8cd1bd10bbd5030abd40a6486040c # go-bash-ci@main 2026-06-30
    with:
      go-version-file: go.mod
      # Widen shellcheck coverage beyond the former install.sh+init/init.bash
      # to include internal/cmd/init.bash and all scripts/ shell files.
      # examples/ deliberately excluded: user-authored content, not CI gates.
      shellcheck-paths: >-
        install.sh
        init/init.bash
        internal/cmd/init.bash
        scripts/acceptance-happy-path.sh
        scripts/acceptance-negative-path.sh
        scripts/bench-plugin-dispatch.sh
        scripts/setup-permissions.sh

  # Emitted context: "goreleaser-check".
  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: latest
          args: check

  # Emitted context: "plugin-dispatch-perf".
  plugin-dispatch-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go build -o dist/shy ./cmd
      - env:
          SHY_BIN: ./dist/shy
          SHY_BENCH_N: "100"
          SHY_BENCH_MAX: "100"
        run: ./scripts/bench-plugin-dispatch.sh
