name: Dark nightly

# Fully-automatic mnab dark-channel publish path (DECISIONS.md
# "CI-grind-konvention", 2026-07-09). No operator gate: builds `after` at
# 00:00 UTC only if there are new commits since the last dark tag, and
# computes the vX.Y.Z-dark.<YYYYMMDD>+<shortsha> release name.
#
# workflow_dispatch exists so the cron path can be proven without waiting
# for 00:00 — trigger manually and inspect the `gate` job's dark-build
# outputs (skipped / dark-tag).

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: alfred-intelligence/.github-workflows/.github/workflows/mnab-gate.yml@9763642610b3559a51c2f37e087d0b240581932a # ci/mnab-gate-gradient PR#5, pending merge — repin on merge
    with:
      channel: dark
      nightly-dark: true
      go-version-file: go.mod
