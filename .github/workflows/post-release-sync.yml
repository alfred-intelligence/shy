name: Post-release sync

on:
  release:
    types: [published]

# contents:write needed to fetch; pull-requests:write needed to open the PR.
# No direct push to main — branch protection is respected via the PR gate.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync-next-to-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Open a PR from next → main instead of direct-pushing.
      # Direct push bypasses branch protection; a PR respects required checks
      # and the operator's review gate. If the PR already exists (re-run after
      # a partial failure), gh pr create exits non-zero — we tolerate that.
      - name: Open next→main sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head next \
            --title "chore: post-release sync next→main" \
            --body "Automated: fast-forwards main to next after release. Opened by post-release-sync workflow." \
          || echo "PR may already exist or next is already merged; continuing."

      # Enable auto-merge so the PR lands without manual intervention, provided
      # all required checks pass. Requires auto-merge to be enabled in repo
      # Settings → General → Allow auto-merge (operator one-time setup).
      - name: Enable auto-merge on sync PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list \
               --base main --head next --state open \
               --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr merge "$PR" --merge --auto
          else
            echo "No open next→main PR found; nothing to auto-merge."
          fi
